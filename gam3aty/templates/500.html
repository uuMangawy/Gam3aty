{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong | Gam3aty</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/utilities.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body>
    <main class="error-page">
        <div>
            <div class="code" aria-hidden="true">500</div>
            <h1>Something broke on our end</h1>
            <p>An unexpected error occurred. Our team has been notified. Please try refreshing — and if it keeps happening, head back home.</p>
            <div class="error-actions">
                <button onclick="location.reload()" class="btn btn-primary">Reload page</button>
                <a href="/" class="btn btn-outline">Go home</a>
            </div>
        </div>
    </main>
</body>
</html>
