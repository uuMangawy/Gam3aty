{% extends "base.html" %}

{% block title %}Update Profile | Gam3aty{% endblock %}

{% block content %}
<style>
    /* ===== PAGE WRAPPER ===== */
    .update-wrapper {
        max-width: 650px;
        margin: 40px auto;
        padding: 0 20px;
    }

    /* ===== NAVIGATION & HEADER ===== */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--primary);
        font-weight: 700;
        font-size: 0.9rem;
        margin-bottom: 25px;
        transition: transform 0.2s;
    }

    .back-link:hover {
        transform: translateX(-5px);
        color: var(--primary-dark);
    }

    .update-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .update-title {
        font-size: 2rem;
        font-weight: 800;
        color: var(--dark);
        margin-bottom: 8px;
    }

    .update-subtitle {
        color: var(--text-muted);
        font-size: 1rem;
    }

    /* ===== FORM CARD ===== */
    .form-card {
        background: var(--white);
        border-radius: 24px;
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(0,0,0,0.05);
    }

    /* ===== SECTION STYLING ===== */
    .section-divider {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 30px 0 20px;
    }

    .section-divider span {
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--primary);
        white-space: nowrap;
    }

    .section-divider::after {
        content: '';
        height: 1px;
        background: #eee;
        width: 100%;
    }

    /* ===== DJANGO FORM OVERRIDES ===== */
    /* This targets the <p> tags generated by {{ form.as_p }} */
    .form-card p {
        margin-bottom: 20px;
    }

    .form-card label {
        display: block;
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--dark);
        margin-bottom: 8px;
    }

    .form-card input[type="text"],
    .form-card input[type="email"],
    .form-card input[type="file"],
    .form-card textarea,
    .form-card select {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
    }

    .form-card input:focus,
    .form-card textarea:focus {
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(0, 74, 173, 0.1);
    }

    .form-card textarea {
        min-height: 120px;
        resize: vertical;
    }

    /* Specific styling for the clear/upload file area */
    .form-card input[type="file"] {
        background: white;
        padding: 10px;
        font-size: 0.85rem;
    }

    /* ===== SAVE BUTTON ===== */
    .btn-save {
        width: 100%;
        padding: 16px;
        margin-top: 20px;
        border: none;
        border-radius: 14px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-save:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 74, 173, 0.25);
    }

    /* Help text (usually password requirements) */
    .helptext {
        display: block;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 5px;
    }
</style>

<div class="update-wrapper">

    <a href="{% url 'profile' %}" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Profile
    </a>

    <div class="update-header">
        <div class="update-title">Settings ⚙️</div>
        <div class="update-subtitle">Personalize your profile and update account security.</div>
    </div>

    <div class="form-card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="section-divider">
                <span>Account Basics</span>
            </div>
            {{ u_form.as_p }}

            <div class="section-divider">
                <span>Public Profile</span>
            </div>
            {{ p_form.as_p }}

            <button type="submit" class="btn-save">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
