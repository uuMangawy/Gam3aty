{% extends "base.html" %}
{% block title %}Settings | Gam3aty{% endblock %}

{% block content %}
<div class="page-narrow" style="max-width: 720px;">

    <a href="{% url 'profile' %}" class="btn btn-ghost btn-sm" style="margin-bottom: var(--space-5);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to profile
    </a>

    <header class="text-center mb-8">
        <span class="eyebrow">Settings</span>
        <h1>Update your profile</h1>
        <p class="text-muted">Keep your account info and public profile up to date.</p>
    </header>

    <div class="surface-card form">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="divider-text">Account basics</div>
            {{ u_form.as_p }}

            <div class="divider-text">Public profile</div>
            {{ p_form.as_p }}

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: var(--space-5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Save changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
