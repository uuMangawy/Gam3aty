{% extends "base.html" %}
{% block title %}Login | Gam3aty{% endblock %}

{% block content %}
<div class="page auth-shell">
    <div class="auth-card form">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to manage your saved programs and favourites.</p>

        {% if error %}
            <div class="alert alert-error" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            <div class="field">
                <label for="login-email">Email Address</label>
                <input id="login-email" type="email" name="email"
                       placeholder="name@example.com" required
                       autocomplete="email" autofocus>
            </div>

            <div class="field">
                <label for="login-password">Password</label>
                <div class="input-with-toggle">
                    <input id="login-password" class="input" type="password" name="password"
                           placeholder="Enter your password" required
                           autocomplete="current-password">
                    <button type="button" class="input-toggle-btn"
                            data-toggle-password="login-password"
                            aria-label="Show password" aria-pressed="false">
                        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             aria-hidden="true" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: var(--space-2);">
                Sign in
            </button>
        </form>

        <p class="auth-foot">
            Don't have an account?
            <a href="{% url 'register' %}">Create one for free</a>
        </p>
    </div>
</div>
{% endblock %}
